name: Build iOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-ios-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-ios-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-ios-

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Rust library
        run: |
          cargo build -p minimap-mobile --target aarch64-apple-ios --release

      - name: Download Switzerland OSM data
        run: |
          curl -L -o switzerland.osm.pbf \
            https://download.geofabrik.de/europe/switzerland-latest.osm.pbf

      - name: Generate map tiles
        run: |
          cargo run -p minimap-tiles --release --features processor --bin tile-processor -- \
            switzerland.osm.pbf tiles/

      - name: Generate routing tiles
        run: |
          cargo run -p minimap-tiles --release --features route-processor --bin route-processor -- \
            switzerland.osm.pbf tiles/

      - name: Build iOS App
        run: |
          cd ios
          ./build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minimap-signed.ipa
          path: ios/build/Minimap-signed.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ios/build/Minimap-signed.ipa
          draft: false
          prerelease: true
