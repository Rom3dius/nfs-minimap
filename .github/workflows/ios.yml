name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'crates/minimap-mobile/**'
      - 'crates/minimap-core/**'
      - 'crates/minimap-tiles/**'
      - 'ui/**'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  build-ios:
    runs-on: macos-14  # M1 runner for faster ARM builds

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install cargo-mobile2
        run: cargo install cargo-mobile2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/minimap-mobile"

      - name: Download Switzerland tiles
        run: |
          # For CI, we'll use a smaller tile subset
          # In production, you'd download from a release or artifact
          mkdir -p crates/minimap-mobile/assets/tiles
          echo "Tiles would be downloaded here"
          # TODO: Add actual tile download from release artifacts

      - name: Initialize mobile project
        working-directory: crates/minimap-mobile
        run: |
          cargo mobile init --skip-targets-install

      - name: Build iOS (Simulator)
        working-directory: crates/minimap-mobile
        run: |
          cargo apple build --simulator --release

      - name: Build iOS (Device - unsigned)
        working-directory: crates/minimap-mobile
        run: |
          cargo apple build --release || echo "Device build may fail without signing"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            crates/minimap-mobile/target/aarch64-apple-ios/release/*.a
            crates/minimap-mobile/gen/apple/
          if-no-files-found: warn

  # Optional: Build signed IPA for TestFlight
  build-signed:
    runs-on: macos-14
    needs: build-ios
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-ios

      - name: Install cargo-mobile2
        run: cargo install cargo-mobile2

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build signed IPA
        working-directory: crates/minimap-mobile
        run: |
          cargo mobile init --skip-targets-install
          cargo apple build --release
          # Package IPA would go here

      - name: Upload to TestFlight
        if: false  # Enable when ready
        run: |
          xcrun altool --upload-app -f app.ipa -t ios -u "${{ secrets.APPLE_ID }}" -p "${{ secrets.APPLE_APP_PASSWORD }}"
