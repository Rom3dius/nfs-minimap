[workspace]
resolver = "2"
members = [
    "crates/minimap-core",
    "crates/minimap-routing",
    "crates/minimap-simulator",
    "crates/minimap-tiles",
    "crates/minimap-mobile",
    # "crates/minimap-esp32p4",  # Uncomment when ready for device
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Your Name <you@example.com>"]

[workspace.dependencies]
# Slint - using GPL license for embedded
slint = "1.9"

# Core utilities
log = "0.4"
env_logger = "0.11"

# Math and geometry
nalgebra = "0.33"

# GPS parsing
nmea = "0.6"

# Serialization (for OSM data)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
