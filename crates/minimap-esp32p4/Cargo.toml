[package]
name = "minimap-esp32p4"
version.workspace = true
edition.workspace = true
license.workspace = true

# ESP32-P4 target settings
# Build with: cargo build --release --target riscv32imafc-esp-espidf

[[bin]]
name = "minimap"
path = "src/main.rs"

[dependencies]
minimap-core = { path = "../minimap-core" }
minimap-tiles = { path = "../minimap-tiles", features = ["loader"] }
minimap-routing = { path = "../minimap-routing" }

# ESP-IDF framework bindings
esp-idf-sys = { version = "0.35", features = ["binstart"] }
esp-idf-hal = "0.44"
esp-idf-svc = { version = "0.49", features = ["alloc"] }

# Slint for ESP-IDF (uses software renderer)
slint = { workspace = true, default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "unsafe-single-threaded",
] }

# Logging
log.workspace = true

# GPS NMEA parsing
nmea.workspace = true

# Error handling
anyhow = "1.0"

[build-dependencies]
embuild = "0.32"
slint-build = "1.9"

# Note: This crate requires the ESP-IDF toolchain
# See: https://docs.esp-rs.org/book/
#
# Setup:
#   cargo install espup
#   espup install
#   . ~/export-esp.sh
#
# Build:
#   cargo build --release
#
# Flash:
#   cargo espflash flash --release --monitor
