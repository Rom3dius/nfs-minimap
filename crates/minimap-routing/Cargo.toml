[package]
name = "minimap-routing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror = "2.0"

# Binary serialization (compact, no_std compatible)
bincode = "1.3"

# For LRU cache (std only)
lru = { version = "0.12", optional = true }

# For search index (std only)
fst = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
env_logger = "0.11"

[features]
default = []
# Enables tile loading (requires std)
loader = ["lru"]
# Enables search index (requires std)
search = ["fst", "memmap2"]
